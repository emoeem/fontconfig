<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <match target="pattern">
    <test name="family"> <string>system-ui</string> </test>
    <edit name="family" mode="prepend" binding="same">
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"> <string>sans-serif</string> </test>
    <edit name="family" mode="append" binding="same">
      <string>MiSans Layin</string>
      <string>MiSans</string>
      <string>MiSans L3</string>
      <string>Symbols Nerd Font</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"> <string>serif</string> </test>
    <edit name="family" mode="append" binding="same">
      <string>LXGW ZhenKai GB</string>
      <string>Noto Serif CJK SC</string>
      <string>Symbols Nerd Font</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"> <string>monospace</string> </test>
    <edit name="family" mode="prepend" binding="same">
      <string>Iosevka Term</string>
      <string>Maple Mono Normal NF CN</string>
      <string>Symbols Nerd Font Mono</string>
      <string>Mi Sans</string>
      <string>Noto Color Emoji</string>
      <string>Mi Sans L3</string>
    </edit>
  </match>

</fontconfig>
